  drawdown_hard_limit: 0.2
  drawdown_soft_penalty: 0.5
  drawdown_hard_penalty: 2.0
  hard_drawdown_terminate: false
training:
  algorithm: PPO
  total_timesteps: 50000
  seed: 42
  model_name: ppo_SPY_E006_dd_budget_15_20
